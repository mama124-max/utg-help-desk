<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTG Help Desk — Live</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     A "token" is just a named value (a CSS variable) so every
     component pulls color/spacing/type from ONE place. Change a
     token here and it updates everywhere it's used — that's the
     whole point of a design system.
     ============================================================ */
  :root{
    /* Color */
    --navy-950:#0F172E;
    --navy-800:#1C2A4A;
    --navy-600:#324569;
    --navy-100:#E7EBF3;
    --paper:#F2F4F7;
    --white:#FFFFFF;
    --teal-600:#0B8A64;
    --teal-100:#DCF4EA;
    --amber-600:#B4790B;
    --amber-100:#FBEACB;
    --coral-600:#C43F1F;
    --coral-100:#FBE3DB;
    --ink-700:#3A4356;
    --ink-500:#6B7488;
    --ink-300:#B7BECC;
    --border:#DCE1EA;

    /* Type — system fonts only, no external font requests */
    --font-display:Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono:ui-monospace, 'SF Mono', 'Courier New', monospace;

    /* Scale */
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(15,23,46,0.06);
    --shadow-md:0 8px 24px rgba(15,23,46,0.10);
    --focus-ring:0 0 0 3px rgba(50,69,105,0.35);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink-700);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); color:var(--navy-950); margin:0;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}

  /* Respect reduced-motion users */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* Visible keyboard focus everywhere — never remove this */
  :focus-visible{outline:none; box-shadow:var(--focus-ring); border-radius:var(--radius-sm);}

  /* Screen-reader-only helper: status must never be color alone */
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ============================================================
     APP SHELL
     ============================================================ */
  .app-shell{max-width:1180px; margin:0 auto; padding:0 20px 80px;}

  /* Auth screen */
  .auth-wrap{max-width:420px; margin:60px auto; padding:32px; background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
  .auth-wrap h2{font-size:22px; margin-bottom:6px;}
  .auth-wrap p.sub{color:var(--ink-500); font-size:13.5px; margin-bottom:20px;}
  .auth-switch{text-align:center; margin-top:16px; font-size:13.5px; color:var(--ink-500);}
  .auth-switch button{background:none; border:none; color:var(--navy-800); font-weight:600; text-decoration:underline; cursor:pointer;}
  .role-pick{display:flex; gap:8px; margin-bottom:16px;}
  .role-pick button{flex:1; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--white); font-size:13px; font-weight:600; color:var(--ink-500);}
  .role-pick button.active{border-color:var(--navy-800); background:var(--navy-100); color:var(--navy-950);}
  .account-area{display:flex; align-items:center; gap:12px; font-size:13px; color:var(--ink-500);}
  .account-area strong{color:var(--navy-950);}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 0; border-bottom:1px solid var(--border); margin-bottom:24px;
    flex-wrap:wrap; gap:12px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:36px; height:36px; border-radius:var(--radius-sm);
    background:var(--navy-950); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:15px;
  }
  .brand-text h1{font-size:18px; font-weight:600;}
  .brand-text span{font-size:12px; color:var(--ink-500);}

  /* Role switcher — implemented as an accessible tablist */
  .role-tabs{display:flex; gap:4px; background:var(--navy-100); padding:4px; border-radius:var(--radius-md);}
  .role-tab{
    border:none; background:transparent; padding:8px 16px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:600; color:var(--navy-600);
  }
  .role-tab[aria-selected="true"]{background:var(--white); color:var(--navy-950); box-shadow:var(--shadow-sm);}

  .page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; gap:16px; flex-wrap:wrap;}
  .page-head h2{font-size:26px; font-weight:600;}
  .page-head p{color:var(--ink-500); margin-top:4px; font-size:14px;}

  /* ============================================================
     COMPONENT: Button
     Variants: primary / secondary / danger / ghost
     States: default / hover / disabled / loading
     ============================================================ */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 18px; border-radius:var(--radius-sm); border:1px solid transparent;
    font-size:14px; font-weight:600; transition:filter .15s ease, transform .05s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:0.55; cursor:not-allowed;}
  .btn-primary{background:var(--navy-950); color:var(--white);}
  .btn-primary:hover:not(:disabled){filter:brightness(1.15);}
  .btn-secondary{background:var(--white); color:var(--navy-950); border-color:var(--border);}
  .btn-secondary:hover:not(:disabled){background:var(--navy-100);}
  .btn-danger{background:var(--coral-600); color:var(--white);}
  .btn-danger:hover:not(:disabled){filter:brightness(1.1);}
  .btn-ghost{background:transparent; color:var(--navy-600);}
  .btn-ghost:hover:not(:disabled){background:var(--navy-100);}
  .btn-sm{padding:6px 12px; font-size:13px;}

  .spinner{
    width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  .spinner-dark{border:2px solid rgba(28,42,74,0.25); border-top-color:var(--navy-800);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ============================================================
     COMPONENT: Status badge
     Never relies on color alone — icon + text every time
     ============================================================ */
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600;
  }
  .badge-dot{width:6px; height:6px; border-radius:50%;}
  .badge-pending{background:var(--amber-100); color:var(--amber-600);}
  .badge-pending .badge-dot{background:var(--amber-600);}
  .badge-review{background:var(--navy-100); color:var(--navy-600);}
  .badge-review .badge-dot{background:var(--navy-600);}
  .badge-resolved{background:var(--teal-100); color:var(--teal-600);}
  .badge-resolved .badge-dot{background:var(--teal-600);}
  .badge-escalated{background:var(--coral-100); color:var(--coral-600);}
  .badge-escalated .badge-dot{background:var(--coral-600);}

  /* ============================================================
     COMPONENT: Complaint card
     ============================================================ */
  .card-grid{display:grid; gap:14px;}
  .complaint-card{
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px 20px; box-shadow:var(--shadow-sm); transition:box-shadow .15s ease;
  }
  .complaint-card:hover{box-shadow:var(--shadow-md);}
  .cc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px;}
  .cc-meta{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-500); letter-spacing:0.02em;}
  .cc-title{font-size:15px; font-weight:600; color:var(--navy-950); margin:2px 0 6px;}
  .cc-desc{font-size:13.5px; color:var(--ink-500); margin-bottom:12px; max-width:60ch;}
  .cc-footer{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .cc-course{font-size:12.5px; color:var(--navy-600); font-weight:600;}

  /* Sequential status trail — the signature element.
     This encodes real information: a complaint's actual journey
     through the system, not decoration. */
  .trail{display:flex; align-items:center; gap:0; margin-top:12px;}
  .trail-step{display:flex; align-items:center; flex:1;}
  .trail-node{
    width:18px; height:18px; border-radius:50%; border:2px solid var(--ink-300);
    background:var(--white); flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .trail-node.done{border-color:var(--teal-600); background:var(--teal-600);}
  .trail-node.current{border-color:var(--navy-800); background:var(--navy-800);}
  .trail-node.done::after{content:''; width:5px; height:5px; border-radius:50%; background:#fff;}
  .trail-node.current::after{content:''; width:5px; height:5px; border-radius:50%; background:#fff;}
  .trail-line{flex:1; height:2px; background:var(--ink-300); margin:0 4px;}
  .trail-line.done{background:var(--teal-600);}
  .trail-labels{display:flex; justify-content:space-between; margin-top:6px;}
  .trail-labels span{font-size:10.5px; color:var(--ink-500); flex:1; text-align:center;}
  .trail-labels span:first-child{text-align:left;}
  .trail-labels span:last-child{text-align:right;}

  /* ============================================================
     COMPONENT: Loading skeleton
     ============================================================ */
  .skeleton{
    background:linear-gradient(90deg, var(--navy-100) 25%, #EEF1F6 37%, var(--navy-100) 63%);
    background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:var(--radius-sm);
  }
  @keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:0 0;}}
  .skeleton-card{padding:18px 20px; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--white);}
  .skeleton-line{height:12px; margin-bottom:10px;}

  /* ============================================================
     COMPONENT: Empty state
     ============================================================ */
  .empty-state{
    text-align:center; padding:56px 24px; border:1px dashed var(--border); border-radius:var(--radius-lg);
    background:var(--white);
  }
  .empty-state .glyph{
    width:44px; height:44px; margin:0 auto 14px; border-radius:50%;
    background:var(--navy-100); color:var(--navy-600);
    display:flex; align-items:center; justify-content:center; font-size:18px; font-family:var(--font-display);
  }
  .empty-state h3{font-size:16px; margin-bottom:6px;}
  .empty-state p{font-size:13.5px; color:var(--ink-500); max-width:38ch; margin:0 auto 18px;}

  /* ============================================================
     COMPONENT: Form input
     ============================================================ */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--navy-950); margin-bottom:6px;}
  .field .hint{font-size:12px; color:var(--ink-500); margin-top:5px;}
  .field .error{font-size:12px; color:var(--coral-600); margin-top:5px; display:flex; align-items:center; gap:5px;}
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    font-family:inherit; font-size:14px; color:var(--ink-700); background:var(--white);
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--navy-600); box-shadow:var(--focus-ring);
  }
  .field.has-error input, .field.has-error textarea{border-color:var(--coral-600);}
  .field textarea{resize:vertical; min-height:90px;}

  /* ============================================================
     COMPONENT: Modal
     ============================================================ */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,23,46,0.5);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal{
    background:var(--white); border-radius:var(--radius-lg); max-width:480px; width:100%;
    padding:24px; box-shadow:var(--shadow-md); max-height:90vh; overflow-y:auto;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;}
  .modal-close{background:transparent; border:none; font-size:20px; color:var(--ink-500); line-height:1; padding:4px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .hidden{display:none !important;}

  /* ============================================================
     COMPONENT: Toast (aria-live)
     ============================================================ */
  #toast-region{
    position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200;
  }
  .toast{
    background:var(--navy-950); color:#fff; padding:12px 16px; border-radius:var(--radius-md);
    font-size:13.5px; box-shadow:var(--shadow-md); display:flex; align-items:center; gap:10px;
    animation:toast-in .2s ease;
  }
  .toast.success{background:var(--teal-600);}
  .toast.error{background:var(--coral-600);}
  @keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* Responsive */
  @media (max-width:640px){
    .topbar{flex-direction:column; align-items:flex-start;}
    .role-tabs{width:100%;}
    .role-tab{flex:1;}
    .page-head{flex-direction:column; align-items:flex-start;}
    .cc-footer{align-items:flex-start;}
  }
</style>
</head>
<body>

<div id="toast-region" aria-live="polite" aria-atomic="true"></div>

<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">UTG</div>
      <div class="brand-text">
        <h1>Campus Help Desk</h1>
        <span>University of The Gambia</span>
      </div>
    </div>
    <div id="accountArea"></div>
  </header>

  <div id="authScreen" class="hidden"></div>

  <div id="appScreen" class="hidden">
  <section class="page-head">
    <div>
      <h2 id="viewTitle">My complaints</h2>
      <p id="viewSubtitle">Track every complaint you've submitted and its current stage.</p>
    </div>
    <div id="viewAction"></div>
  </section>

  <div id="mainRegion" class="card-grid" aria-live="polite"></div>
  </div>

</div>

<script>
/* ================================================================
   REUSABLE COMPONENTS
   Each one is a plain function that takes a "props" object and
   returns a real DOM element. This is the same mental model React
   components use (props in → UI out) — just without a framework,
   since HTML/CSS/JS is what you know right now. When you pick up
   React later, this pattern will already feel familiar.
   ================================================================ */

// ---- Button --------------------------------------------------
function Button({ label, variant = 'primary', size = '', onClick, loading = false, disabled = false, type = 'button' }) {
  const btn = document.createElement('button');
  btn.type = type;
  btn.className = `btn btn-${variant} ${size ? 'btn-' + size : ''}`;
  btn.disabled = disabled || loading;
  btn.setAttribute('aria-busy', loading ? 'true' : 'false');
  btn.innerHTML = loading
    ? `<span class="spinner ${variant === 'secondary' || variant === 'ghost' ? 'spinner-dark' : ''}"></span><span>${label}</span>`
    : label;
  if (onClick) btn.addEventListener('click', onClick);
  return btn;
}

// ---- Status badge ---------------------------------------------
// status: 'pending' | 'review' | 'resolved' | 'escalated'
const STATUS_META = {
  pending:   { cls: 'badge-pending',   text: 'Pending' },
  review:    { cls: 'badge-review',    text: 'In review' },
  resolved:  { cls: 'badge-resolved',  text: 'Resolved' },
  escalated: { cls: 'badge-escalated', text: 'Escalated' },
};
function Badge({ status }) {
  const meta = STATUS_META[status];
  const span = document.createElement('span');
  span.className = `badge ${meta.cls}`;
  span.innerHTML = `<span class="badge-dot" aria-hidden="true"></span>${meta.text}`;
  return span;
}

// ---- Status trail (signature element) --------------------------
// Encodes the real, ordered journey of a complaint.
function StatusTrail({ status }) {
  const stages = ['Submitted', 'Lecturer review', 'Resolved'];
  const stageIndex = { pending: 0, review: 1, resolved: 2, escalated: 1 }[status];

  const wrap = document.createElement('div');
  const trail = document.createElement('div');
  trail.className = 'trail';
  trail.setAttribute('role', 'img');
  trail.setAttribute('aria-label', `Complaint stage: ${stages[stageIndex]} of ${stages.length}`);

  stages.forEach((_, i) => {
    const step = document.createElement('div');
    step.className = 'trail-step';
    const node = document.createElement('div');
    node.className = 'trail-node' + (i < stageIndex ? ' done' : i === stageIndex ? ' current' : '');
    step.appendChild(node);
    if (i < stages.length - 1) {
      const line = document.createElement('div');
      line.className = 'trail-line' + (i < stageIndex ? ' done' : '');
      step.appendChild(line);
    }
    trail.appendChild(step);
  });

  const labels = document.createElement('div');
  labels.className = 'trail-labels';
  labels.innerHTML = stages.map(s => `<span>${s}</span>`).join('');

  wrap.append(trail, labels);
  return wrap;
}

// ---- Complaint card ---------------------------------------------
function ComplaintCard({ id, title, course, category, description, status, date, onOpen }) {
  const card = document.createElement('article');
  card.className = 'complaint-card';
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', `Open complaint: ${title}, status ${STATUS_META[status].text}`);

  const top = document.createElement('div');
  top.className = 'cc-top';
  const metaWrap = document.createElement('div');
  metaWrap.innerHTML = `
    <div class="cc-meta">${id} · ${category} · ${date}</div>
    <div class="cc-title">${title}</div>
  `;
  top.appendChild(metaWrap);
  top.appendChild(Badge({ status }));

  const desc = document.createElement('p');
  desc.className = 'cc-desc';
  desc.textContent = description;

  const footer = document.createElement('div');
  footer.className = 'cc-footer';
  footer.innerHTML = `<span class="cc-course">${course}</span>`;
  const viewBtn = Button({ label: 'View details', variant: 'ghost', size: 'sm' });
  footer.appendChild(viewBtn);

  card.append(top, desc, StatusTrail({ status }), footer);

  const open = () => onOpen && onOpen({ id, title, course, category, description, status, date });
  card.addEventListener('click', open);
  card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });

  return card;
}

// ---- Loading skeleton --------------------------------------------
function SkeletonCard() {
  const card = document.createElement('div');
  card.className = 'skeleton-card';
  card.setAttribute('aria-hidden', 'true');
  card.innerHTML = `
    <div class="skeleton skeleton-line" style="width:40%; height:10px;"></div>
    <div class="skeleton skeleton-line" style="width:70%; height:16px; margin-top:8px;"></div>
    <div class="skeleton skeleton-line" style="width:90%;"></div>
    <div class="skeleton skeleton-line" style="width:55%;"></div>
  `;
  return card;
}

// ---- Empty state ----------------------------------------------
function EmptyState({ glyph = '✓', title, message, actionLabel, onAction }) {
  const el = document.createElement('div');
  el.className = 'empty-state';
  el.innerHTML = `
    <div class="glyph" aria-hidden="true">${glyph}</div>
    <h3>${title}</h3>
    <p>${message}</p>
  `;
  if (actionLabel) {
    el.appendChild(Button({ label: actionLabel, variant: 'primary', onClick: onAction }));
  }
  return el;
}

// ---- Form field (label + input, wired for a11y + errors) --------
function Field({ id, label, type = 'text', hint, required = false, textarea = false, options = null }) {
  const wrap = document.createElement('div');
  wrap.className = 'field';
  wrap.id = `field-${id}`;

  const lbl = document.createElement('label');
  lbl.htmlFor = id;
  lbl.textContent = label + (required ? ' *' : '');
  wrap.appendChild(lbl);

  let input;
  if (options) {
    input = document.createElement('select');
    input.innerHTML = options.map(o => `<option value="${o}">${o}</option>`).join('');
  } else if (textarea) {
    input = document.createElement('textarea');
  } else {
    input = document.createElement('input');
    input.type = type;
  }
  input.id = id;
  input.name = id;
  if (required) input.required = true;
  if (hint) input.setAttribute('aria-describedby', `hint-${id}`);
  wrap.appendChild(input);

  if (hint) {
    const hintEl = document.createElement('p');
    hintEl.className = 'hint';
    hintEl.id = `hint-${id}`;
    hintEl.textContent = hint;
    wrap.appendChild(hintEl);
  }

  wrap.getValue = () => input.value;
  wrap.setError = (msg) => {
    wrap.classList.toggle('has-error', !!msg);
    let errEl = wrap.querySelector('.error');
    if (msg) {
      if (!errEl) {
        errEl = document.createElement('p');
        errEl.className = 'error';
        wrap.appendChild(errEl);
      }
      errEl.textContent = '⚠ ' + msg;
      input.setAttribute('aria-invalid', 'true');
    } else if (errEl) {
      errEl.remove();
      input.removeAttribute('aria-invalid');
    }
  };
  return wrap;
}

// ---- Modal (focus-trapped, Escape to close) ----------------------
function openModal({ title, bodyEl, primaryLabel, onPrimary, primaryLoading }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute('aria-labelledby', 'modalTitle');

  const head = document.createElement('div');
  head.className = 'modal-head';
  head.innerHTML = `<h3 id="modalTitle">${title}</h3>`;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.setAttribute('aria-label', 'Close dialog');
  closeBtn.innerHTML = '&times;';
  head.appendChild(closeBtn);

  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const cancelBtn = Button({ label: 'Cancel', variant: 'secondary' });
  actions.appendChild(cancelBtn);
  if (primaryLabel) {
    const primaryBtn = Button({ label: primaryLabel, variant: 'primary', onClick: () => onPrimary && onPrimary(close) });
    actions.appendChild(primaryBtn);
  }

  modal.append(head, bodyEl, actions);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const previouslyFocused = document.activeElement;
  modal.querySelector('input, textarea, select, button')?.focus();

  function close() {
    overlay.remove();
    previouslyFocused?.focus();
    document.removeEventListener('keydown', onKeydown);
  }
  function onKeydown(e) {
    if (e.key === 'Escape') close();
    if (e.key === 'Tab') {
      const focusables = modal.querySelectorAll('button, input, textarea, select');
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  document.addEventListener('keydown', onKeydown);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  closeBtn.addEventListener('click', () => close());
  cancelBtn.addEventListener('click', () => close());

  return { close };
}

// ---- Toast --------------------------------------------------
function showToast(message, variant = 'default') {
  const region = document.getElementById('toast-region');
  const toast = document.createElement('div');
  toast.className = `toast ${variant}`;
  toast.textContent = message;
  region.appendChild(toast);
  setTimeout(() => toast.remove(), 3200);
}

// ---- Supabase connection ----
// This is the ONLY spot with your project's credentials.
// The publishable key is safe to expose in frontend code.
const SUPABASE_URL = 'https://wcmswcchshdppaxrocpm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_rMzgvrNyWbWNsE_gSqqUTg_ojwj0imc';
const AUTH_URL = `${SUPABASE_URL}/auth/v1`;

// ---- Session state ----
let session = null;   // { access_token, user }

function authHeaders() {
  return {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${session ? session.access_token : SUPABASE_KEY}`,
    'Content-Type': 'application/json',
  };
}

// Tiny hand-rolled REST client — talks to Supabase's built-in API
// using nothing but the browser's own fetch(), so there's no external
// library to download. Every request automatically uses the signed-in
// user's own token once they're logged in, which is what lets the
// database's security rules know who is asking.
const db = {
  async select(table, params = '') {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: authHeaders() });
    if (!res.ok) throw new Error(`${table}: ${await res.text()}`);
    return res.json();
  },
  async insert(table, row) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { ...authHeaders(), Prefer: 'return=representation' },
      body: JSON.stringify(row),
    });
    if (!res.ok) throw new Error(`${table}: ${await res.text()}`);
    return res.json();
  },
  async patch(table, params, patchBody) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, {
      method: 'PATCH',
      headers: { ...authHeaders(), Prefer: 'return=representation' },
      body: JSON.stringify(patchBody),
    });
    if (!res.ok) throw new Error(`${table}: ${await res.text()}`);
    return res.json();
  },
};

// ---- Auth actions ----
function persistSession() { localStorage.setItem('utg_session', JSON.stringify(session)); }
function loadStoredSession() {
  const raw = localStorage.getItem('utg_session');
  if (raw) { try { session = JSON.parse(raw); } catch { session = null; } }
}
function signOut() { session = null; localStorage.removeItem('utg_session'); location.reload(); }

async function signUp({ email, password, fullName, role, matricNo }) {
  const res = await fetch(`${AUTH_URL}/signup`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Sign up failed');
  if (!data.access_token) throw new Error('Account created. If email confirmation is required, check your inbox, then log in.');
  session = { access_token: data.access_token, user: data.user };
  persistSession();
  await db.insert('profiles', { id: data.user.id, full_name: fullName, role, matric_no: matricNo || null });
  if (role === 'student') {
    await db.insert('students', { auth_user_id: data.user.id, matric_no: matricNo || null, name: fullName, program_id: 1, level: null });
  } else if (role === 'lecturer') {
    await db.insert('lecturers', { auth_user_id: data.user.id, name: fullName, email });
  }
}

async function signIn({ email, password }) {
  const res = await fetch(`${AUTH_URL}/token?grant_type=password`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed — check your email and password.');
  session = { access_token: data.access_token, user: data.user };
  persistSession();
}

async function loadProfileAndRole() {
  const rows = await db.select('profiles', `id=eq.${session.user.id}`);
  profile = rows[0];
  if (!profile) throw new Error('Signed in, but no profile found for this account.');

  // Self-healing: if an earlier sign-up got interrupted partway (e.g. by
  // a rate limit) it's possible the login/profile exists but the linked
  // student or lecturer record never got created. Rather than leave the
  // account stuck, we quietly create the missing row here so the app
  // keeps working without the person needing to know any of this happened.
  if (profile.role === 'student') {
    let rows2 = await db.select('students', `auth_user_id=eq.${session.user.id}`);
    if (!rows2.length && profile.matric_no) {
      // Someone (e.g. a demo/seed row) might already have this matric
      // number without being linked to a login yet — claim it instead
      // of creating a duplicate, since matric numbers must be unique.
      const existing = await db.select('students', `matric_no=eq.${profile.matric_no}&auth_user_id=is.null`);
      if (existing.length) {
        rows2 = await db.patch('students', `id=eq.${existing[0].id}`, { auth_user_id: session.user.id, name: profile.full_name });
      }
    }
    if (!rows2.length) {
      rows2 = await db.insert('students', {
        auth_user_id: session.user.id,
        matric_no: profile.matric_no,
        name: profile.full_name,
        program_id: 1,
        level: null,
      });
    }
    myStudentRow = rows2[0] || null;
  } else if (profile.role === 'lecturer') {
    let rows2 = await db.select('lecturers', `auth_user_id=eq.${session.user.id}`);
    if (!rows2.length) {
      rows2 = await db.insert('lecturers', {
        auth_user_id: session.user.id,
        name: profile.full_name,
        email: null,
      });
    }
    myLecturerRow = rows2[0] || null;
  }
}

let COURSES = [];        // full course catalog, loaded once on startup
let COURSES_BY_ID = {};

async function loadCourseCatalog() {
  try {
    COURSES = await db.select('courses', 'order=code.asc');
    COURSES_BY_ID = Object.fromEntries(COURSES.map(c => [c.id, c]));
  } catch (err) {
    console.error(err);
    showToast('Could not load course list', 'error');
  }
}

// activeRole now comes directly from the signed-in user's profile —
// no more manual tab-switching between roles.
let activeRole = null;

const mainRegion = document.getElementById('mainRegion');
const viewTitle = document.getElementById('viewTitle');
const viewSubtitle = document.getElementById('viewSubtitle');
const viewAction = document.getElementById('viewAction');

async function renderView() {
  mainRegion.innerHTML = '';
  viewAction.innerHTML = '';

  // Safety check: if the role-specific record is still missing for any
  // reason, show a clear message instead of crashing.
  if (activeRole === 'student' && !myStudentRow) {
    mainRegion.appendChild(EmptyState({ glyph: '!', title: 'Account setup incomplete', message: 'Your student record could not be found. Try signing out and back in.' }));
    return;
  }
  if (activeRole === 'lecturer' && !myLecturerRow) {
    mainRegion.appendChild(EmptyState({ glyph: '!', title: 'Account setup incomplete', message: 'Your lecturer record could not be found. Try signing out and back in.' }));
    return;
  }

  // 1. Loading state — shown immediately, before any network call resolves.
  for (let i = 0; i < 3; i++) mainRegion.appendChild(SkeletonCard());

  let params = 'order=created_at.desc';

  if (activeRole === 'student') {
    viewTitle.textContent = 'My complaints';
    viewSubtitle.textContent = "Track every complaint you've submitted and its current stage.";
    viewAction.appendChild(Button({ label: '+ New complaint', variant: 'primary', onClick: openNewComplaintModal }));
    params += `&student_id=eq.${myStudentRow.id}`;
  } else if (activeRole === 'lecturer') {
    viewTitle.textContent = 'Complaints from my students';
    viewSubtitle.textContent = 'Review, respond, and approve before they reach admin.';
    const myCourseIds = COURSES.filter(c => c.lecturer_id === myLecturerRow.id).map(c => c.id);
    params += myCourseIds.length ? `&course_id=in.(${myCourseIds.join(',')})` : '&id=eq.-1';
  } else {
    viewTitle.textContent = 'All complaints';
    viewSubtitle.textContent = 'System-wide view, including lecturers with no response yet.';
    params += '&admin_visible=eq.true';
  }

  let data;
  try {
    data = await db.select('complaints', params);
  } catch (err) {
    mainRegion.innerHTML = '';
    mainRegion.appendChild(EmptyState({
      glyph: '!',
      title: 'Could not load complaints',
      message: err.message || 'Something went wrong talking to the database.',
    }));
    console.error(err);
    return;
  }
  mainRegion.innerHTML = '';

  // 2. Empty state — explicit, actionable, not just a blank div.
  if (data.length === 0) {
    mainRegion.appendChild(EmptyState({
      glyph: '—',
      title: 'No complaints to show',
      message: activeRole === 'admin'
        ? 'Nothing has been escalated to admin yet. Approved complaints from lecturers will appear here.'
        : "You haven't filed a complaint yet. Anything affecting your grades or coursework can be logged here.",
      actionLabel: activeRole === 'student' ? 'File your first complaint' : null,
      onAction: activeRole === 'student' ? openNewComplaintModal : null,
    }));
    return;
  }

  // 3. Populated state — map real DB rows onto the card component's shape.
  data.forEach(row => {
    const course = COURSES_BY_ID[row.course_id];
    mainRegion.appendChild(ComplaintCard({
      id: `CMP-${String(row.id).padStart(4, '0')}`,
      title: row.description.slice(0, 48) + (row.description.length > 48 ? '…' : ''),
      course: course ? `${course.code} · ${course.title}` : 'Unknown course',
      category: row.category,
      description: row.description,
      status: row.status,
      date: new Date(row.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }),
      onOpen: () => openDetailModal(row, course),
    }));
  });
}

function openDetailModal(row, course) {
  const displayId = `CMP-${String(row.id).padStart(4, '0')}`;
  const body = document.createElement('div');
  body.innerHTML = `
    <p style="font-size:13px;color:var(--ink-500);margin-bottom:10px;">${displayId} · ${course ? `${course.code} · ${course.title}` : 'Unknown course'}</p>
    <p style="font-size:14px;margin-bottom:14px;">${row.description}</p>
  `;
  body.appendChild(StatusTrail({ status: row.status }));

  if (row.lecturer_response) {
    const respEl = document.createElement('div');
    respEl.style.cssText = 'margin-top:16px; padding:12px 14px; background:var(--navy-100); border-radius:var(--radius-sm);';
    respEl.innerHTML = `<p style="font-size:12px;font-weight:600;color:var(--navy-800);margin-bottom:4px;">Lecturer's response</p><p style="font-size:13.5px;color:var(--ink-700);">${row.lecturer_response}</p>`;
    body.appendChild(respEl);
  }

  // Lecturer-only actions: respond, and approve to send to admin.
  if (activeRole === 'lecturer') {
    const respField = Field({ id: 'lecturerResponse', label: 'Your response', textarea: true, hint: 'This will be visible to the student.' });
    if (row.lecturer_response) respField.querySelector('textarea').value = row.lecturer_response;
    const statusField = Field({ id: 'statusUpdate', label: 'Update status', options: ['pending', 'review', 'resolved', 'escalated'] });
    statusField.querySelector('select').value = row.status;
    body.append(document.createElement('hr'), respField, statusField);

    openModal({
      title: row.description.slice(0, 48),
      bodyEl: body,
      primaryLabel: row.lecturer_approved ? 'Save changes' : 'Respond & send to admin',
      onPrimary: async (close) => {
        try {
          await db.patch('complaints', `id=eq.${row.id}`, {
            lecturer_response: respField.getValue(),
            status: statusField.getValue(),
            lecturer_approved: true,
            admin_visible: true,
            updated_at: new Date().toISOString(),
          });
          close();
          showToast('Response saved — visible to student and admin.', 'success');
          renderView();
        } catch (err) {
          showToast('Could not save — ' + err.message, 'error');
          console.error(err);
        }
      }
    });
    return;
  }

  openModal({ title: row.description.slice(0, 48), bodyEl: body, primaryLabel: null });
}

function openNewComplaintModal() {
  const body = document.createElement('div');
  const categoryField = Field({ id: 'category', label: 'Category', options: ['grade complaint', 'general complaint'], required: true });

  // Course field: a real dropdown of "CODE — Title", built from the live
  // catalog we loaded from Supabase. Picking the code shows the full
  // name right there in the option — that's the "auto-fill" you asked about.
  const courseField = Field({
    id: 'course',
    label: 'Course',
    required: true,
    options: COURSES.map(c => `${c.code} — ${c.title}`),
  });

  const descField = Field({ id: 'desc', label: 'Describe the issue', textarea: true, required: true, hint: 'Be specific — include dates, assessment names, or evidence where possible.' });
  body.append(categoryField, courseField, descField);

  openModal({
    title: 'File a new complaint',
    bodyEl: body,
    primaryLabel: 'Submit complaint',
    onPrimary: async (close) => {
      let valid = true;
      if (!descField.getValue().trim()) { descField.setError('Please describe the issue'); valid = false; } else descField.setError('');
      if (!valid) return;

      const selectedCode = courseField.getValue().split(' — ')[0];
      const course = COURSES.find(c => c.code === selectedCode);

      try {
        await db.insert('complaints', {
          student_id: myStudentRow.id,
          course_id: course ? course.id : null,
          category: categoryField.getValue(),
          description: descField.getValue(),
        });
      } catch (err) {
        showToast('Could not submit — ' + err.message, 'error');
        console.error(err);
        return;
      }

      close();
      showToast('Complaint submitted — you\'ll be notified when your lecturer responds.', 'success');
      renderView();
    }
  });
}

// ==============================================================
// AUTH SCREEN — sign in / sign up, shown before the app itself.
// ==============================================================
const authScreenEl = document.getElementById('authScreen');
const appScreenEl = document.getElementById('appScreen');
const accountAreaEl = document.getElementById('accountArea');

let authMode = 'login'; // 'login' | 'signup'
let signupRole = 'student';

function renderAuthScreen() {
  authScreenEl.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'auth-wrap';

  const heading = document.createElement('h2');
  heading.textContent = authMode === 'login' ? 'Sign in' : 'Create your account';
  const sub = document.createElement('p');
  sub.className = 'sub';
  sub.textContent = authMode === 'login'
    ? 'Sign in to Campus Help Desk.'
    : 'Register as a student, lecturer, or admin.';
  wrap.append(heading, sub);

  const form = document.createElement('div');

  if (authMode === 'signup') {
    const rolePick = document.createElement('div');
    rolePick.className = 'role-pick';
    ['student', 'lecturer', 'admin'].forEach(r => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = r[0].toUpperCase() + r.slice(1);
      b.className = r === signupRole ? 'active' : '';
      b.addEventListener('click', () => { signupRole = r; renderAuthScreen(); });
      rolePick.appendChild(b);
    });
    form.appendChild(rolePick);
  }

  const nameField = authMode === 'signup' ? Field({ id: 'fullName', label: 'Full name', required: true }) : null;
  const matricField = (authMode === 'signup' && signupRole === 'student')
    ? Field({ id: 'matricNo', label: 'Matric number', required: true, hint: 'e.g. 22426047' }) : null;
  const studentEmail = authMode === 'signup' && signupRole === 'student';
  const emailField = Field({
    id: 'email',
    label: studentEmail ? 'UTG Email' : 'Email',
    type: 'email',
    required: true,
    hint: studentEmail ? 'e.g. mc22426047@utg.edu.gm' : undefined,
  });
  const passField = Field({ id: 'password', label: 'Password', type: 'password', required: true });

  [nameField, matricField, emailField, passField].forEach(f => { if (f) form.appendChild(f); });

  const submitBtn = Button({
    label: authMode === 'login' ? 'Sign in' : 'Create account',
    variant: 'primary',
    onClick: async () => {
      const emailVal = emailField.getValue().trim().toLowerCase();
      // Only students use the matric-based @utg.edu.gm address — lecturers
      // and admins have their own staff email formats, so we don't force
      // that pattern on them. Login doesn't check domain at all, since
      // that was already validated once at sign-up.
      const requiresUtgDomain = authMode === 'signup' && signupRole === 'student';
      if (requiresUtgDomain && !emailVal.endsWith('@utg.edu.gm')) {
        emailField.setError('Must be a UTG student email (e.g. mc22426047@utg.edu.gm)');
        return;
      } else {
        emailField.setError('');
      }
      submitBtn.disabled = true;
      submitBtn.setAttribute('aria-busy', 'true');
      try {
        if (authMode === 'login') {
          await signIn({ email: emailVal, password: passField.getValue() });
        } else {
          if (!nameField.getValue().trim()) { nameField.setError('Required'); throw new Error('__silent__'); }
          if (signupRole === 'student' && !matricField.getValue().trim()) { matricField.setError('Required'); throw new Error('__silent__'); }
          await signUp({
            email: emailVal,
            password: passField.getValue(),
            fullName: nameField.getValue(),
            role: signupRole,
            matricNo: matricField ? matricField.getValue() : null,
          });
        }
        await enterApp();
      } catch (err) {
        if (err.message !== '__silent__') showToast(err.message, 'error');
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.setAttribute('aria-busy', 'false');
      }
    }
  });
  submitBtn.style.width = '100%';
  form.appendChild(submitBtn);

  const switchWrap = document.createElement('div');
  switchWrap.className = 'auth-switch';
  const switchBtn = document.createElement('button');
  switchBtn.type = 'button';
  switchBtn.textContent = authMode === 'login' ? "New here? Create an account" : "Already have an account? Sign in";
  switchBtn.addEventListener('click', () => { authMode = authMode === 'login' ? 'signup' : 'login'; renderAuthScreen(); });
  switchWrap.appendChild(switchBtn);

  wrap.append(form, switchWrap);
  authScreenEl.appendChild(wrap);
}

function renderAccountArea() {
  accountAreaEl.innerHTML = '';
  if (!profile) return;
  const wrap = document.createElement('div');
  wrap.className = 'account-area';
  wrap.innerHTML = `<span>Signed in as <strong>${profile.full_name}</strong> · ${profile.role}</span>`;
  wrap.appendChild(Button({ label: 'Sign out', variant: 'ghost', size: 'sm', onClick: signOut }));
  accountAreaEl.appendChild(wrap);
}

async function enterApp() {
  await loadProfileAndRole();
  activeRole = profile.role;
  authScreenEl.classList.add('hidden');
  appScreenEl.classList.remove('hidden');
  renderAccountArea();
  await loadCourseCatalog();
  await renderView();
}

(async function start() {
  try {
    loadStoredSession();
    if (session) {
      try {
        await enterApp();
        return;
      } catch (err) {
        // stored session is stale/invalid — fall through to login screen
        console.error(err);
        signOut();
        return;
      }
    }
    authScreenEl.classList.remove('hidden');
    renderAuthScreen();
  } catch (err) {
    authScreenEl.innerHTML = `<div class="empty-state"><h3>Something broke while rendering</h3><p>${err.message}</p></div>`;
    authScreenEl.classList.remove('hidden');
    console.error(err);
  }
})();
</script>
