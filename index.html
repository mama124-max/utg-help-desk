<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTG Help Desk — Live</title>
<style>
  :root{
    --navy-950:#0F172E;
    --navy-800:#1C2A4A;
    --navy-600:#324569;
    --navy-100:#E7EBF3;
    --paper:#F2F4F7;
    --white:#FFFFFF;
    --teal-600:#0B8A64;
    --teal-100:#DCF4EA;
    --amber-600:#B4790B;
    --amber-100:#FBEACB;
    --coral-600:#C43F1F;
    --coral-100:#FBE3DB;
    --ink-700:#3A4356;
    --ink-500:#6B7488;
    --ink-300:#B7BECC;
    --border:#DCE1EA;

    --font-display:Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono:ui-monospace, 'SF Mono', 'Courier New', monospace;

    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(15,23,46,0.06);
    --shadow-md:0 8px 24px rgba(15,23,46,0.10);
    --focus-ring:0 0 0 3px rgba(50,69,105,0.35);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink-700);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); color:var(--navy-950); margin:0;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}

  .hidden{display:none !important;}

  .app-shell{max-width:1180px; margin:0 auto; padding:0 20px 80px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 0; border-bottom:1px solid var(--border); margin-bottom:24px;
    flex-wrap:wrap; gap:12px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:36px; height:36px; border-radius:var(--radius-sm);
    background:var(--navy-950); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:15px;
  }
  .brand-text h1{font-size:18px; font-weight:600;}
  .brand-text span{font-size:12px; color:var(--ink-500);}

  .auth-wrap{max-width:420px; margin:60px auto; padding:32px; background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
  .auth-wrap h2{font-size:22px; margin-bottom:6px;}
  .auth-wrap p.sub{color:var(--ink-500); font-size:13.5px; margin-bottom:20px;}
  .auth-switch{text-align:center; margin-top:16px; font-size:13.5px; color:var(--ink-500);}
  .auth-switch button{background:none; border:none; color:var(--navy-800); font-weight:600; text-decoration:underline; cursor:pointer;}
  .role-pick{display:flex; gap:8px; margin-bottom:16px;}
  .role-pick button{flex:1; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--white); font-size:13px; font-weight:600; color:var(--ink-500);}
  .role-pick button.active{border-color:var(--navy-800); background:var(--navy-100); color:var(--navy-950);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--navy-950); margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    font-family:inherit; font-size:14px; color:var(--ink-700); background:var(--white);
  }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 18px; border-radius:var(--radius-sm); border:1px solid transparent;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-primary{background:var(--navy-950); color:var(--white);}

  .academic-filter-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .year-select-group{display:flex; align-items:center; gap:10px;}
  .semester-pills{display:flex; gap:6px; background:var(--paper); padding:4px; border-radius:var(--radius-md);}
  .pill-btn{border:none; background:transparent; padding:6px 14px; border-radius:var(--radius-sm); font-size:12.5px; font-weight:600; color:var(--ink-500);}
  .pill-btn.active{background:var(--navy-950); color:var(--white);}

  #toast-region{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200;}
  .toast{background:var(--navy-950); color:#fff; padding:12px 16px; border-radius:var(--radius-md); font-size:13.5px;}
  .toast.success{background:var(--teal-600);}
  .toast.error{background:var(--coral-600);}
</style>
</head>
<body>

<div id="toast-region" aria-live="polite" aria-atomic="true"></div>

<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">UTG</div>
      <div class="brand-text">
        <h1>Campus Help Desk</h1>
        <span>University of The Gambia</span>
      </div>
    </div>
  </header>

  <!-- JS INSERTS SIGN IN FORM HERE -->
  <div id="authScreen"></div>

  <!-- MAIN APP DASHBOARD -->
  <div id="appScreen" class="hidden">
    <section class="page-head">
      <div>
        <h2>My complaints</h2>
        <p>Track every complaint you've submitted and its current stage.</p>
      </div>
    </section>

    <div class="academic-filter-card">
      <div class="year-select-group">
        <label for="academicYearSelect">Academic Year:</label>
        <select id="academicYearSelect">
          <option value="2025-2026">2025 / 2026</option>
          <option value="2026-2027" selected>2026 / 2027</option>
          <option value="2027-2028">2027 / 2028</option>
        </select>
      </div>
      <div class="semester-pills">
        <button class="pill-btn active" data-sem="1">Semester 1</button>
        <button class="pill-btn" data-sem="2">Semester 2</button>
        <button class="pill-btn" data-sem="3">Summer</button>
      </div>
    </div>

    <div id="mainRegion" class="card-grid"></div>
  </div>

</div>

<!-- LINK TO JS FILE -->
<script src="script.js"></script>
</body>
</html>
